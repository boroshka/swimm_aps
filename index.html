<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пул задач — тренировки пловца</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #EAF3F7;
    --ink-soft: #8FA9BD;
    --pool: #3D9BE0;
    --pool-deep: #2C7FC1;
    --amber: #E8A94A;
    --success: #4FBF83;
    --bg: #071B2E;
    --card: #0E2A42;
    --line: #1C3B52;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 110px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 22px;
  }
  .lanes {
    height: 6px;
    background: repeating-linear-gradient(90deg, var(--pool) 0 18px, transparent 18px 26px);
    border-radius: 3px;
    margin-bottom: 24px;
    opacity: 0.55;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
  }
  select, input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 14px;
  }
  select:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--pool);
    outline-offset: 1px;
  }
  button {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--pool-deep);
    color: white;
    width: 100%;
  }
  .btn-primary:hover { background: var(--pool); }
  .btn-finish {
    background: var(--success);
  }
  .btn-finish:hover { opacity: 0.9; }

  .task {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
  }
  .task:last-child { border-bottom: none; }
  .task-idx {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--pool);
    font-weight: 600;
    font-size: 13px;
    min-width: 20px;
  }
  .task-body { flex: 1; }
  .task-text { font-size: 14.5px; }
  .swap-btn {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    font-size: 12px;
    padding: 6px 10px;
    white-space: nowrap;
  }
  .swap-btn:hover { color: var(--pool-deep); border-color: var(--pool); }

  .empty {
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
    padding: 30px 10px;
  }

  .workout-status {
    display: inline-block;
    background: var(--amber);
    color: white;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }

  .result-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .result-item:last-child { border-bottom: none; }
  .result-top {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
  }
  .result-date { color: var(--ink-soft); font-size: 12.5px; margin-top: 2px; }
  .result-note { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }
  .del { color: var(--ink-soft); background: none; border: none; font-size: 12px; cursor: pointer; padding: 2px 4px; }
  .del:hover { color: #C0392B; }

  .stat-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--pool-deep);
  }
  .stat-label { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

  .profile-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 4px 0 20px;
  }
  .profile-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .profile-row:last-of-type { border-bottom: none; }
  .profile-label { color: var(--ink-soft); }
  .profile-value { font-weight: 600; }

  .hero-card {
    position: relative;
    background: linear-gradient(160deg, var(--card), var(--bg));
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 20px 18px;
    margin-bottom: 14px;
  }
  .hero-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 23px;
    letter-spacing: -0.01em;
    padding-right: 40px;
  }
  .hero-rows { margin-top: 14px; }
  .hero-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 13.5px;
    border-bottom: 1px solid var(--line);
  }
  .hero-row:last-child { border-bottom: none; }
  .hero-row span:first-child { color: var(--ink-soft); }
  .hero-row span:last-child { font-weight: 600; }
  .pencil-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 14px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pencil-btn:hover { color: var(--pool-deep); border-color: var(--pool); }
  .edit-link {
    background: none;
    border: none;
    color: var(--pool-deep);
    font-size: 13px;
    font-weight: 600;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }
  .hidden { display: none !important; }

  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    margin: 24px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  .badge {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-right: 4px;
    margin-top: 4px;
  }
  .history-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .history-item:last-child { border-bottom: none; }
  .history-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
  }
  .history-date { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; }
  .history-meta { font-size: 12px; color: var(--ink-soft); white-space: nowrap; text-align: right; }
  .history-tasks {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .history-task { padding: 3px 0; }

  .bottomnav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 10;
  }
  .navbtn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    padding: 6px 4px;
    cursor: pointer;
  }
  .navbtn .nav-icon { font-size: 19px; line-height: 1; }
  .navbtn.active { color: var(--pool-deep); font-weight: 600; }

  .cal-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-nav-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 16px;
    padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .cal-nav-btn:active { transform: scale(0.9); background: var(--bg); }
  .cal-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    text-transform: capitalize;
  }
  .view-toggle {
    display: flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 16px;
  }
  .view-toggle-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px;
    border-radius: 8px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .view-toggle-btn.active {
    background: var(--pool-deep);
    color: white;
    box-shadow: 0 2px 6px rgba(44, 127, 193, 0.35);
  }
  .cal-grid-month {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-weekday {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    padding-bottom: 6px;
  }
  .cal-day {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 12px;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13.5px;
    font-weight: 500;
    padding: 0;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }
  .cal-day:active { transform: scale(0.93); }
  .cal-day-outside { opacity: 0.28; box-shadow: none; }
  .cal-day-today {
    border-color: var(--pool);
    box-shadow: 0 0 0 3px rgba(61, 155, 224, 0.22);
  }
  .cal-day-active {
    background: linear-gradient(145deg, #59CB93, var(--success));
    border-color: transparent;
    color: white;
    font-weight: 700;
    box-shadow: 0 3px 10px rgba(79, 191, 131, 0.35);
  }
  .cal-day-selected {
    box-shadow: 0 0 0 3px rgba(232, 169, 74, 0.45);
    border-color: var(--amber);
  }
  .cal-grid-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .cal-day-week {
    aspect-ratio: auto;
    height: 68px;
    flex-direction: column;
    gap: 5px;
    border-radius: 14px;
  }
  .cal-day-wd { font-size: 10.5px; color: inherit; opacity: 0.75; font-weight: 600; letter-spacing: 0.02em; }
  .cal-day-num { font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div id="regScreen" class="card hidden">
    <label for="regFirst">Имя</label>
    <input type="text" id="regFirst" placeholder="Имя">
    <label for="regLast">Фамилия</label>
    <input type="text" id="regLast" placeholder="Фамилия">
    <label for="regBirthDate">Дата рождения</label>
    <input type="date" id="regBirthDate">
    <label for="regLevel">Уровень плавания</label>
    <select id="regLevel">
      <option value="beginner">Новичок</option>
      <option value="intermediate">Любитель</option>
      <option value="advanced">Продвинутый</option>
    </select>
    <label for="regStroke">Каким стилем хочешь плавать больше всего</label>
    <select id="regStroke">
      <option value="freestyle">Вольный стиль</option>
      <option value="backstroke">На спине</option>
      <option value="breaststroke">Брасс</option>
      <option value="butterfly">Баттерфляй</option>
      <option value="medley">Комплексное плавание</option>
    </select>
    <button class="btn-primary" onclick="saveProfile()">Сохранить и начать</button>
  </div>

  <div id="mainScreen" class="hidden">

    <div id="trainTab" class="tabcontent">
      <div id="generatorCard" class="card">
        <label for="type">Тип нагрузки</label>
        <select id="type">
          <option value="aerobic">Аэробная</option>
          <option value="anaerobic">Анаэробная</option>
          <option value="sprint">Спринтерская (триатлон)</option>
          <option value="distance">Стайерская</option>
        </select>
        <button class="btn-primary" onclick="generate()">Сгенерировать тренировку</button>
      </div>
      <div id="workoutCard" class="card hidden">
        <div id="workoutStatus" class="workout-status hidden">Тренировка в процессе</div>
        <div id="taskList"></div>
        <div id="workoutActions" style="margin-top: 6px;"></div>
      </div>
      <div id="genEmpty" class="empty">Выберите тип нагрузки, затем нажмите «Сгенерировать»</div>
    </div>

    <div id="profileTab" class="tabcontent hidden">
      <div class="hero-card">
        <button class="pencil-btn" onclick="showRegistration(true)" aria-label="Изменить">✎</button>
        <div class="hero-name" id="heroName"></div>
        <div class="hero-rows">
          <div class="hero-row"><span>Способ плавания</span><span id="pvStroke"></span></div>
          <div class="hero-row"><span>Уровень плавания</span><span id="pvLevel"></span></div>
          <div class="hero-row"><span>Дата рождения</span><span id="pvBirth"></span></div>
        </div>
      </div>

      <div class="card" id="statsCard">
        <div class="stat-row">
          <div class="stat"><div class="stat-num" id="statVolume">0 м</div><div class="stat-label">всего проплыто</div></div>
        </div>
        <div class="stat-row">
          <div class="stat"><div class="stat-num" id="statWeek">0 м</div><div class="stat-label">на этой неделе</div></div>
          <div class="stat"><div class="stat-num" id="statMonth">0 м</div><div class="stat-label">в этом месяце</div></div>
        </div>
        <div class="hero-row"><span>Тренировок завершено</span><span id="statWorkouts">0</span></div>
        <button class="edit-link" id="chartToggleBtn" onclick="toggleChart()" style="margin-top: 10px;">Подробнее →</button>
      </div>
      <div id="chartCard" class="card hidden">
        <div class="section-title" style="margin-top: 0;">Метраж по неделям</div>
        <div id="volumeChart"></div>
      </div>
    </div>

    <div id="calendarTab" class="tabcontent hidden">
      <div class="cal-toolbar">
        <button class="cal-nav-btn" onclick="calPrev()">‹</button>
        <div class="cal-label" id="calendarLabel"></div>
        <button class="cal-nav-btn" onclick="calNext()">›</button>
      </div>
      <div class="view-toggle">
        <button class="view-toggle-btn active" data-view="month" onclick="setCalendarView('month')">Месяц</button>
        <button class="view-toggle-btn" data-view="week" onclick="setCalendarView('week')">Неделя</button>
      </div>
      <div id="calendarGrid" class="cal-grid"></div>
      <div id="calendarDetails"></div>
    </div>

  </div>
</div>

<nav class="bottomnav hidden" id="bottomNav">
  <button class="navbtn active" data-tab="trainTab"><span class="nav-icon">🏊</span>Тренировка</button>
  <button class="navbtn" data-tab="calendarTab"><span class="nav-icon">📅</span>Календарь</button>
  <button class="navbtn" data-tab="profileTab"><span class="nav-icon">👤</span>Профиль</button>
</nav>

<script>
const POOL = {
  aerobic: {
    beginner: [
      "400м вольный стиль в спокойном темпе",
      "8×50м вольный стиль, отдых 20 сек",
      "300м комплексное плавание (техника)",
      "6×50м на технику дыхания"
    ],
    intermediate: [
      "800м вольный стиль равномерно",
      "10×100м вольный стиль, отдых 15 сек",
      "6×200м комплекс, умеренный темп",
      "16×50м с работой ног"
    ],
    advanced: [
      "1500м вольный стиль равномерно",
      "12×100м вольный стиль, отдых 10 сек",
      "8×200м комплекс, темп ниже соревновательного",
      "20×50м с акцентом на технику гребка"
    ]
  },
  anaerobic: {
    beginner: [
      "6×25м с максимальным усилием, отдых 40 сек",
      "4×50м на скорость, отдых 60 сек",
      "8×15м стартовые ускорения"
    ],
    intermediate: [
      "10×50м на скорость, отдых 45 сек",
      "6×100м с нарастанием темпа",
      "8×25м максимум, короткий отдых 20 сек"
    ],
    advanced: [
      "12×50м на максимальной скорости, отдых 30 сек",
      "8×100м близко к соревновательному темпу",
      "6×25м на максимум с минимальным отдыхом"
    ]
  },
  sprint: {
    beginner: [
      "4×25м спринт из воды, отдых 45 сек",
      "6×50м прогрессия темпа по 12.5м",
      "Отработка старта — 6 стартовых прыжков"
    ],
    intermediate: [
      "8×25м спринт, отдых 40 сек",
      "6×50м на максимальной скорости",
      "4×100м спринт вторая половина дистанции"
    ],
    advanced: [
      "10×25м максимальный спринт, отдых 30 сек",
      "8×50м соревновательный темп",
      "Серия стартов и поворотов на скорость"
    ]
  },
  distance: {
    beginner: [
      "600м равномерно, фокус на дыхание",
      "4×150м вольный стиль, ровный темп",
      "10×50м с удлинённым гребком"
    ],
    intermediate: [
      "1200м равномерно",
      "6×200м вольный стиль, стабильный темп",
      "8×100м на выносливость"
    ],
    advanced: [
      "2000м равномерно без остановок",
      "8×250м вольный стиль, стабильный темп",
      "10×150м на выносливость с контролем темпа"
    ]
  }
};

const LEVEL_LABEL = { beginner: 'Новичок', intermediate: 'Любитель', advanced: 'Продвинутый' };
const STROKE_LABEL = { freestyle: 'вольный стиль', backstroke: 'на спине', breaststroke: 'брасс', butterfly: 'баттерфляй', medley: 'комплексное плавание' };
const TYPE_LABEL = { aerobic: 'Аэробная', anaerobic: 'Анаэробная', sprint: 'Спринт', distance: 'Стайер' };

let profile = null;
let workout = { state: 'idle', tasks: [], startedAt: null };

const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
const cloud = (tg && tg.CloudStorage) ? tg.CloudStorage : null;

function csGet(key) {
  return new Promise((resolve) => {
    cloud.getItem(key, (err, value) => resolve(err ? null : value));
  });
}
function csSet(key, value) {
  return new Promise((resolve) => {
    cloud.setItem(key, value, () => resolve());
  });
}

// Загружает значение: из Telegram CloudStorage, если открыто внутри Telegram,
// иначе из localStorage браузера (для тестирования вне Telegram).
async function loadState(key, fallback) {
  try {
    if (cloud) {
      const raw = await csGet(key);
      return raw ? JSON.parse(raw) : fallback;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
async function saveState(key, value) {
  try {
    const raw = JSON.stringify(value);
    if (cloud) { await csSet(key, raw); return; }
    localStorage.setItem(key, raw);
  } catch (e) {}
}

document.querySelectorAll('.navbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tabcontent').forEach(p => p.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.remove('hidden');
    if (btn.dataset.tab === 'calendarTab') {
      renderCalendar();
    }
    if (btn.dataset.tab === 'profileTab') {
      renderProfileStats();
    }
  });
});

function pickTasks(type, level, count) {
  const source = POOL[type][level];
  const shuffled = [...source].sort(() => Math.random() - 0.5);
  const picked = [];
  for (let i = 0; i < count; i++) {
    picked.push(shuffled[i % shuffled.length]);
  }
  return picked;
}

// Подставляет предпочитаемый стиль пловца вместо дефолтного "вольный стиль" в тексте задания
function personalizeText(text) {
  if (!profile || profile.stroke === 'freestyle') return text;
  const replacement = STROKE_LABEL[profile.stroke];
  return text.replace(/вольный стиль/gi, replacement);
}

function updateProfileSummary() {
  if (!profile) return;
  document.getElementById('heroName').textContent = `${profile.firstName} ${profile.lastName}`.trim();
  document.getElementById('pvBirth').textContent = formatBirthDate(profile.birthDate);
  document.getElementById('pvStroke').textContent = STROKE_LABEL[profile.stroke] || '—';
  document.getElementById('pvLevel').textContent = LEVEL_LABEL[profile.level] || '—';
}

// Извлекает метраж из текста задания: считает "N×Mм" как N*M, отдельные "Nм" — как есть
function parseTaskMeters(text) {
  let total = 0;
  const multRe = /(\d+)\s*×\s*(\d+)\s*м(?![а-яё])/gi;
  let m;
  while ((m = multRe.exec(text)) !== null) {
    total += parseInt(m[1], 10) * parseInt(m[2], 10);
  }
  const withoutMult = text.replace(multRe, ' ');
  const singleRe = /(\d+)\s*м(?![а-яё])/gi;
  let m2;
  while ((m2 = singleRe.exec(withoutMult)) !== null) {
    total += parseInt(m2[1], 10);
  }
  return total;
}

function formatVolume(m) {
  if (m >= 1000) return `${(m / 1000).toFixed(1).replace(/\.0$/, '')} км`;
  return `${m} м`;
}

function volumeSum(history) {
  return history.reduce((sum, h) => sum + h.tasks.reduce((s, t) => s + parseTaskMeters(t), 0), 0);
}

async function renderProfileStats() {
  const history = await loadState('swimdemo_history', []);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const weekStart = startOfWeek(now);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  const allVol = volumeSum(history);
  const weekVol = volumeSum(history.filter(h => new Date(h.date) >= weekStart));
  const monthVol = volumeSum(history.filter(h => new Date(h.date) >= monthStart));

  document.getElementById('statVolume').textContent = formatVolume(allVol);
  document.getElementById('statWeek').textContent = formatVolume(weekVol);
  document.getElementById('statMonth').textContent = formatVolume(monthVol);
  document.getElementById('statWorkouts').textContent = history.length;

  renderVolumeChart(history);
}

function toggleChart() {
  const card = document.getElementById('chartCard');
  card.classList.toggle('hidden');
  document.getElementById('chartToggleBtn').textContent = card.classList.contains('hidden') ? 'Подробнее →' : 'Скрыть';
}

function buildWeeklyBuckets(history, weeks) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const currentWeekStart = startOfWeek(now);
  const buckets = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const s = new Date(currentWeekStart); s.setDate(currentWeekStart.getDate() - 7 * i);
    const e = new Date(s); e.setDate(s.getDate() + 7);
    const vol = volumeSum(history.filter(h => { const d = new Date(h.date); return d >= s && d < e; }));
    buckets.push({ start: s, volume: vol });
  }
  return buckets;
}

function renderVolumeChart(history) {
  const buckets = buildWeeklyBuckets(history, 8);
  const max = Math.max(1, ...buckets.map(b => b.volume));
  const w = 320, h = 130, chartH = h - 24;
  const slot = w / buckets.length;
  const barW = slot - 8;
  const bars = buckets.map((b, i) => {
    const barH = Math.round((b.volume / max) * chartH);
    const x = i * slot + 4;
    const y = h - barH - 16;
    const label = b.volume >= 1000 ? (b.volume / 1000).toFixed(1) + 'к' : (b.volume || '');
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${Math.max(barH, b.volume > 0 ? 3 : 0)}" rx="3" fill="var(--pool)"></rect>
      ${label ? `<text x="${x + barW / 2}" y="${y - 4}" font-size="8" fill="var(--ink-soft)" text-anchor="middle">${label}</text>` : ''}
      <text x="${x + barW / 2}" y="${h - 4}" font-size="7" fill="var(--ink-soft)" text-anchor="middle">${pad2(b.start.getDate())}.${pad2(b.start.getMonth() + 1)}</text>
    `;
  }).join('');
  document.getElementById('volumeChart').innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="140" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}

function formatBirthDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function showRegistration(prefill) {
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('bottomNav').classList.add('hidden');
  document.getElementById('regScreen').classList.remove('hidden');
  if (prefill && profile) {
    document.getElementById('regFirst').value = profile.firstName || '';
    document.getElementById('regLast').value = profile.lastName || '';
    document.getElementById('regBirthDate').value = profile.birthDate || '';
    document.getElementById('regLevel').value = profile.level || 'beginner';
    document.getElementById('regStroke').value = profile.stroke || 'freestyle';
  }
}

function showMain() {
  document.getElementById('regScreen').classList.add('hidden');
  document.getElementById('mainScreen').classList.remove('hidden');
  document.getElementById('bottomNav').classList.remove('hidden');
  updateProfileSummary();
}

async function saveProfile() {
  const firstName = document.getElementById('regFirst').value.trim();
  const lastName = document.getElementById('regLast').value.trim();
  const birthDate = document.getElementById('regBirthDate').value;
  const level = document.getElementById('regLevel').value;
  const stroke = document.getElementById('regStroke').value;
  if (!firstName || !birthDate) return;
  profile = { firstName, lastName, birthDate, level, stroke };
  await saveState('swimdemo_profile', profile);
  showMain();
  renderWorkout();
}

async function generate() {
  const type = document.getElementById('type').value;
  const level = profile.level;
  const countByLevel = { beginner: 3, intermediate: 4, advanced: 5 };
  workout = {
    state: 'ready',
    tasks: pickTasks(type, level, countByLevel[level]).map(text => ({ text: personalizeText(text), type, level })),
    startedAt: null
  };
  renderWorkout();
  await saveState('swimdemo_workout', workout);
}

async function swapTask(idx) {
  if (workout.state !== 'ready') return;
  const w = workout.tasks[idx];
  const alternatives = POOL[w.type][w.level].filter(t => personalizeText(t) !== w.text);
  if (alternatives.length === 0) return;
  const next = alternatives[Math.floor(Math.random() * alternatives.length)];
  workout.tasks[idx] = { text: personalizeText(next), type: w.type, level: w.level };
  renderWorkout();
  await saveState('swimdemo_workout', workout);
}

async function startSwim() {
  if (workout.state !== 'ready') return;
  workout.state = 'active';
  workout.startedAt = Date.now();
  renderWorkout();
  await saveState('swimdemo_workout', workout);
}

async function finishSwim() {
  if (workout.state !== 'active') return;
  const history = await loadState('swimdemo_history', []);
  const firstType = workout.tasks[0] ? workout.tasks[0].type : null;
  const durationMin = workout.startedAt ? Math.max(1, Math.round((Date.now() - workout.startedAt) / 60000)) : null;
  history.unshift({
    id: Date.now(),
    date: new Date().toISOString().slice(0, 10),
    type: firstType,
    level: profile.level,
    stroke: profile.stroke,
    tasks: workout.tasks.map(t => t.text),
    durationMin
  });
  await saveState('swimdemo_history', history);
  workout = { state: 'idle', tasks: [], startedAt: null };
  await saveState('swimdemo_workout', workout);
  renderWorkout();
}

function renderWorkout() {
  const genCard = document.getElementById('generatorCard');
  const card = document.getElementById('workoutCard');
  const empty = document.getElementById('genEmpty');
  const list = document.getElementById('taskList');
  const actions = document.getElementById('workoutActions');
  const statusLabel = document.getElementById('workoutStatus');

  if (workout.state === 'idle' || !workout.tasks.length) {
    genCard.classList.remove('hidden');
    card.classList.add('hidden');
    empty.classList.remove('hidden');
    return;
  }

  genCard.classList.add('hidden');
  empty.classList.add('hidden');
  card.classList.remove('hidden');

  const locked = workout.state === 'active';

  list.innerHTML = workout.tasks.map((t, i) => `
    <div class="task">
      <div class="task-idx">${i + 1}</div>
      <div class="task-body"><div class="task-text">${t.text}</div></div>
      ${locked ? '' : `<button class="swap-btn" onclick="swapTask(${i})">Заменить</button>`}
    </div>
  `).join('');

  if (locked) {
    statusLabel.classList.remove('hidden');
    actions.innerHTML = `<button class="btn-primary btn-finish" onclick="finishSwim()">Завершить тренировку</button>`;
  } else {
    statusLabel.classList.add('hidden');
    actions.innerHTML = `<button class="btn-primary" onclick="startSwim()">Плыть</button>`;
  }
}

async function getHistoryMap() {
  const history = await loadState('swimdemo_history', []);
  const map = {};
  history.forEach(h => { (map[h.date] = map[h.date] || []).push(h); });
  return map;
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function toISODate(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function startOfWeek(date) {
  const d = new Date(date);
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  d.setHours(0, 0, 0, 0);
  return d;
}
function monthMatrix(date) {
  const year = date.getFullYear(), month = date.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const gridStart = new Date(year, month, 1 - startOffset);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    days.push(d);
  }
  return days;
}

let calendarView = 'month';
let calendarDate = new Date();
let selectedDate = null;

function calPrev() {
  if (calendarView === 'month') calendarDate.setMonth(calendarDate.getMonth() - 1);
  else calendarDate.setDate(calendarDate.getDate() - 7);
  renderCalendar();
}
function calNext() {
  if (calendarView === 'month') calendarDate.setMonth(calendarDate.getMonth() + 1);
  else calendarDate.setDate(calendarDate.getDate() + 7);
  renderCalendar();
}
function setCalendarView(v) {
  calendarView = v;
  renderCalendar();
}
function selectCalendarDay(iso) {
  selectedDate = (selectedDate === iso) ? null : iso;
  renderCalendar();
}

const MONTH_NAMES = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTH_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WEEKDAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

async function renderCalendar() {
  const map = await getHistoryMap();
  const label = document.getElementById('calendarLabel');
  const grid = document.getElementById('calendarGrid');
  document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.view === calendarView));
  const todayISO = toISODate(new Date());

  if (calendarView === 'month') {
    label.textContent = `${MONTH_NAMES[calendarDate.getMonth()]} ${calendarDate.getFullYear()}`;
    const days = monthMatrix(calendarDate);
    grid.className = 'cal-grid cal-grid-month';
    grid.innerHTML = WEEKDAYS.map(d => `<div class="cal-weekday">${d}</div>`).join('') +
      days.map(d => {
        const iso = toISODate(d);
        const classes = ['cal-day'];
        if (d.getMonth() !== calendarDate.getMonth()) classes.push('cal-day-outside');
        if (map[iso]) classes.push('cal-day-active');
        if (iso === todayISO) classes.push('cal-day-today');
        if (iso === selectedDate) classes.push('cal-day-selected');
        return `<button class="${classes.join(' ')}" onclick="selectCalendarDay('${iso}')">${d.getDate()}</button>`;
      }).join('');
  } else {
    const start = startOfWeek(calendarDate);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    const fmt = d => `${d.getDate()} ${MONTH_SHORT[d.getMonth()]}`;
    label.textContent = `${fmt(start)} – ${fmt(end)}`;
    grid.className = 'cal-grid cal-grid-week';
    grid.innerHTML = Array.from({ length: 7 }).map((_, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const iso = toISODate(d);
      const classes = ['cal-day', 'cal-day-week'];
      if (map[iso]) classes.push('cal-day-active');
      if (iso === todayISO) classes.push('cal-day-today');
      if (iso === selectedDate) classes.push('cal-day-selected');
      return `<button class="${classes.join(' ')}" onclick="selectCalendarDay('${iso}')"><span class="cal-day-wd">${WEEKDAYS[i]}</span><span class="cal-day-num">${d.getDate()}</span></button>`;
    }).join('');
  }

  renderDayDetails(map);
}

function renderDayDetails(map) {
  const wrap = document.getElementById('calendarDetails');
  if (!selectedDate) { wrap.innerHTML = ''; return; }
  const entries = map[selectedDate];
  const [y, m, d] = selectedDate.split('-');
  const dateLabel = `${d}.${m}.${y}`;
  if (!entries) {
    wrap.innerHTML = `<div class="section-title">${dateLabel}</div><div class="empty">В этот день тренировок не было</div>`;
    return;
  }
  wrap.innerHTML = `<div class="section-title">${dateLabel}</div>` + entries.map(h => `
    <div class="history-item">
      <div>
        ${h.type ? `<span class="badge">${TYPE_LABEL[h.type] || h.type}</span>` : ''}
        <span class="badge">${LEVEL_LABEL[h.level] || h.level}</span>
        <span class="badge">${STROKE_LABEL[h.stroke] || h.stroke}</span>
        ${h.durationMin ? `<span class="badge">${h.durationMin} мин</span>` : ''}
      </div>
      <div class="history-tasks" style="border-top: none; margin-top: 8px; padding-top: 0;">
        ${h.tasks.map((t, i) => `<div class="history-task">${i + 1}. ${t}</div>`).join('')}
      </div>
    </div>
  `).join('');
}

(async function init() {
  if (tg) {
    tg.ready();
    tg.expand();
  }
  profile = await loadState('swimdemo_profile', null);
  if (!profile) {
    showRegistration(false);
  } else {
    showMain();
  }
  workout = await loadState('swimdemo_workout', { state: 'idle', tasks: [], startedAt: null });
  renderWorkout();
  await renderProfileStats();
})();
</script>
